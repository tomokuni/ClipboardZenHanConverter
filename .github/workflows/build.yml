# ビルドワークフロー
#
# 実行契機は次のとおり。
#   main への push（マージ含む） … 必ず実行する
#   main 向け Pull Request       … 必ず実行する
#   release/** への push         … 系列ブランチ（release/<major>.<minor>）のゲートとして実行する
#   手動実行（workflow_dispatch）  … dev など他のブランチで確認する場合に使用する
#
# 復元・Release ビルド・全テストを実行する（配布物の作成と公開は行わない）。
#
# 本ワークフローは「検証」だけを行い、配布物の作成は release.yml が publish.yml を通じて行う。
# この実行結果はリリースの前提（ゲート）になる。Release ワークフローは、リリース対象コミットに対する
# 本ワークフローの成功実行が存在することを確認してから Release を作成する。
#
# .NET SDK のバージョンはリポジトリルートの global.json が単一所有する（ワークフローでは指定しない）。
# テストの実行基盤（Microsoft.Testing.Platform / MTP）も global.json の test.runner が単一所有する。
# dotnet の対象（ソリューション ファイル）は release-config.json の solutionFile が単一所有する。
# NuGet パッケージのキャッシュは setup-dotnet の cache 機能を使う（actions/cache を別途書かない）。
#
# WinUI 3 / Windows Forms のテストを含むため windows-latest で実行する。
#
# README の「build」バッジはこのワークフローの status を表示する（badge.svg?branch=main）。
name: Build

on:
  push:
    # main への push では必ず実行する（dev への push では実行しない。dev で確認する場合は手動実行する）
    # release/** は系列ブランチ（release/<major>.<minor>）からのバックポート時に、ゲートの Build として実行する
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  # 手動実行（dev など任意のブランチでの確認、およびバージョンコミットの検証に使用する）
  workflow_dispatch:

permissions:
  contents: read

# 同一ブランチの古い実行は打ち切る（バッジは最新の実行結果を表示する）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # テストが停止した場合に 6 時間（既定）待たないための上限。
    # 通常はビルド + テストで 3 分程度のため、超過は異常とみなして失敗させる
    timeout-minutes: 30
    steps:
      - name: チェックアウト
        uses: actions/checkout@v5

      # 対象のソリューション ファイルは release-config.json が単一所有する
      - name: リリース設定を読む
        id: config
        uses: ./.github/actions/read-config

      # .NET SDK は毎回ダウンロードされると 300MB（展開に約 20 秒）かかるため、
      # インストール先をジョブの一時領域へ移してキャッシュする。
      # 既定の C:\Program Files\dotnet はランナー画像のシステム領域でキャッシュできない。
      # setup-dotnet より前に復元する（dotnet-install.ps1 は同じバージョンが既にあれば
      # ダウンロードも展開も行わないため、2 回目以降のセットアップは実質ゼロ時間になる）。
      - name: .NET SDK をキャッシュ
        uses: actions/cache@v6
        with:
          # ワークスペースの外へ置き、チェックアウトの clean やハッシュ計算へ影響させない
          path: ${{ runner.temp }}/dotnet
          # global.json の内容でキーを作る。SDK が更新されてキャッシュが古くなった場合は
          # 末尾の版（v1）を上げると作り直される
          key: dotnet-${{ runner.os }}-v1-${{ hashFiles('global.json') }}
          # global.json が変わっても直近のキャッシュから復元し、足りない分だけをインストールさせる
          restore-keys: |
            dotnet-${{ runner.os }}-v1-

      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@v5
        env:
          # キャッシュ対象と同じディレクトリへインストールする（上の path と揃えること）
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          # バージョンは global.json が単一所有する（dotnet-version は指定しない）
          # NuGet のグローバル パッケージ フォルダをキャッシュする
          cache: true
          cache-dependency-path: '**/*.csproj'

      # 以降は --no-restore / --no-build で工程を分け、失敗箇所を切り分けやすくする
      # パスは設定（release-config.json）が持つため、空白を含んでいても壊れないよう引用符で囲む
      - name: 復元
        run: dotnet restore '${{ steps.config.outputs.solution_file }}'

      - name: ビルド（Release）
        run: dotnet build '${{ steps.config.outputs.solution_file }}' -c Release --no-restore

      # 4 つの UI のテストを含む全テストプロジェクトを実行する
      # xunit.v3 4 系は Microsoft.Testing.Platform（MTP）で実行するため、対象は位置引数ではなく
      # --solution で指定する（位置引数を渡すとテスト アプリへの引数として扱われ、0 件・終了コード 5 になる）
      - name: テスト（Release）
        run: dotnet test --solution '${{ steps.config.outputs.solution_file }}' -c Release --no-build
